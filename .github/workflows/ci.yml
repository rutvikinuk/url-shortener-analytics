name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test
      - name: Dependency audit
        run: composer audit
      - name: Code style (advisory)
        run: vendor/bin/pint --test
        continue-on-error: true

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: url-shortener:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 url-shortener:ci
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/up >/dev/null && break
            sleep 1
          done
          curl -fs http://localhost:8000/up >/dev/null
          curl -fs http://localhost:8000/dashboard/ | grep -q 'id="root"'
          curl -fs -X POST http://localhost:8000/api/links \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -d '{"destination_url":"https://example.com","slug":"ci-demo"}'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ci-demo)" = "302"
      - name: Container logs (on failure)
        if: failure()
        run: docker logs app
