name: Update vulnerable Composer deps (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite
          tools: composer:v2
      - run: composer update league/commonmark symfony/http-foundation --with-dependencies --no-interaction --no-progress
      - run: composer audit
      - run: cp .env.example .env && php artisan key:generate && php artisan test
      - name: Commit lock file
        run: |
          git config user.name 'Rutvik Patel'
          git config user.email 'patelrutvikn@gmail.com'
          git add composer.lock
          git commit -m "Update league/commonmark and symfony/http-foundation to fix security advisories"
          git push origin HEAD:main
